<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="710" viewBox="0 0 1440 710" role="img"><title>release-flow / release-publisher 1.2.0</title><rect x="1" y="1" width="1438" height="708" rx="22" fill="#f7f9ff" stroke="#d2dbef"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="18" font-weight="700" fill="#3f4c9e">RELEASE PUBLISHER / v1.2.0</text><text x="40" y="104" font-size="42" font-weight="700" fill="#172342">功能变了，发布资料一起更新</text><text x="40" y="148" font-size="24" font-weight="400" fill="#172342">先评估变化，再同步图文、发行包与公开入口。</text><rect x="40" y="200" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="236" font-size="20" font-weight="700" fill="#3f4c9e">01</text><text x="64" y="275" font-size="28" font-weight="700" fill="#172342">锁定发布输入</text><text x="64" y="312" font-size="23" font-weight="400" fill="#40506e">基线、候选、版本与授权</text><rect x="500" y="200" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="524" y="236" font-size="20" font-weight="700" fill="#3f4c9e">02</text><text x="524" y="275" font-size="28" font-weight="700" fill="#172342">评估功能变化</text><text x="524" y="312" font-size="23" font-weight="400" fill="#40506e">按用户影响判断更新范围</text><rect x="960" y="200" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="984" y="236" font-size="20" font-weight="700" fill="#3f4c9e">03</text><text x="984" y="275" font-size="28" font-weight="700" fill="#172342">安排图文更新</text><text x="984" y="312" font-size="23" font-weight="400" fill="#40506e">对应正文、用法、配图和证据</text><rect x="40" y="390" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="426" font-size="20" font-weight="700" fill="#3f4c9e">04</text><text x="64" y="465" font-size="28" font-weight="700" fill="#172342">核验本地候选</text><text x="64" y="502" font-size="23" font-weight="400" fill="#40506e">检查页面、版本和解压文件</text><rect x="500" y="390" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="524" y="426" font-size="20" font-weight="700" fill="#3f4c9e">05</text><text x="524" y="465" font-size="28" font-weight="700" fill="#172342">按授权发布</text><text x="524" y="502" font-size="23" font-weight="400" fill="#40506e">提交、标签、Release 与附件</text><rect x="960" y="390" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="984" y="426" font-size="20" font-weight="700" fill="#3f4c9e">06</text><text x="984" y="465" font-size="28" font-weight="700" fill="#172342">回验公开结果</text><text x="984" y="502" font-size="23" font-weight="400" fill="#40506e">检查页面，下载并核对哈希</text><rect x="40" y="606" width="1360" height="78" rx="16" fill="#eceffc" stroke="#d2dbef"/><text x="62" y="638" font-size="22" font-weight="400" fill="#40506e">未通过 → 修正后复验</text><text x="62" y="674" font-size="22" font-weight="400" fill="#40506e">仅做候选 → 本地交付；获授权 → 公开回验</text></g></svg>