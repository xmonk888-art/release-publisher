<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1060" viewBox="0 0 760 1060" role="img"><title>change-decisions / release-publisher 1.2.0</title><rect x="1" y="1" width="758" height="1058" rx="22" fill="#f7f9ff" stroke="#d2dbef"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="18" font-weight="700" fill="#3f4c9e">RELEASE PUBLISHER / v1.2.0</text><text x="40" y="104" font-size="38" font-weight="700" fill="#172342">Choose the right visual update</text><text x="40" y="148" font-size="24" font-weight="400" fill="#172342">Put important changes in the docs. Retain accurate graphics.</text><rect x="40" y="186" width="680" height="174" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="228" font-size="30" font-weight="700" fill="#172342">Small fix</text><text x="64" y="273" font-size="26" font-weight="700" fill="#3f4c9e">Check accuracy; reuse valid graphics</text><text x="64" y="316" font-size="24" font-weight="400" fill="#40506e">Update notes; no mandatory redraw.</text><rect x="40" y="382" width="680" height="174" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="424" font-size="30" font-weight="700" fill="#172342">New capability</text><text x="64" y="469" font-size="26" font-weight="700" fill="#3f4c9e">Add feature docs and usage entry</text><text x="64" y="512" font-size="24" font-weight="400" fill="#40506e">Add visuals when explanation needs them.</text><rect x="40" y="578" width="680" height="174" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="620" font-size="30" font-weight="700" fill="#172342">Core flow change</text><text x="64" y="665" font-size="26" font-weight="700" fill="#3f4c9e">Rewrite affected usage and relationships</text><text x="64" y="708" font-size="24" font-weight="400" fill="#40506e">Rebuild changed nodes and branches.</text><rect x="40" y="774" width="680" height="174" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="816" font-size="30" font-weight="700" fill="#172342">New positioning</text><text x="64" y="861" font-size="26" font-weight="700" fill="#3f4c9e">Reassess the hero and capability story</text><text x="64" y="904" font-size="24" font-weight="400" fill="#40506e">Adjust page order to match actual changes.</text><text x="40" y="1026" font-size="22" font-weight="400" fill="#40506e">Workflow rules · Impact matters more than the version number</text></g></svg>