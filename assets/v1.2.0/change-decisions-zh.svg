<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img"><title>change-decisions / release-publisher 1.2.0</title><rect x="1" y="1" width="1438" height="788" rx="22" fill="#f7f9ff" stroke="#d2dbef"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="18" font-weight="700" fill="#3f4c9e">RELEASE PUBLISHER / v1.2.0</text><text x="40" y="104" font-size="42" font-weight="700" fill="#172342">变化决定更新方式</text><text x="40" y="148" font-size="24" font-weight="400" fill="#172342">重要变化进入正文与用法，准确的旧图可以复用。</text><rect x="40" y="186" width="1360" height="116" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="229" font-size="28" font-weight="700" fill="#172342">小修复</text><text x="430" y="229" font-size="27" font-weight="700" fill="#3f4c9e">核对准确性，保留有效旧图</text><text x="430" y="269" font-size="24" font-weight="400" fill="#40506e">更新版本说明，不强制重画。</text><rect x="40" y="320" width="1360" height="116" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="363" font-size="28" font-weight="700" fill="#172342">新增功能</text><text x="430" y="363" font-size="27" font-weight="700" fill="#3f4c9e">补充正文、入口与使用示例</text><text x="430" y="403" font-size="24" font-weight="400" fill="#40506e">需要直观解释时，再增加图文。</text><rect x="40" y="454" width="1360" height="116" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="497" font-size="28" font-weight="700" fill="#172342">核心流程变化</text><text x="430" y="497" font-size="27" font-weight="700" fill="#3f4c9e">重写受影响用法与流程关系</text><text x="430" y="537" font-size="24" font-weight="400" fill="#40506e">节点、分支变了，重构对应图。</text><rect x="40" y="588" width="1360" height="116" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="631" font-size="28" font-weight="700" fill="#172342">定位或主要能力变化</text><text x="430" y="631" font-size="27" font-weight="700" fill="#3f4c9e">重新评估首屏与核心能力展示</text><text x="430" y="671" font-size="24" font-weight="400" fill="#40506e">按实际变化调整页面顺序。</text><text x="40" y="756" font-size="22" font-weight="400" fill="#40506e">示意规则 · 不按版本号大小机械判断重大更新</text></g></svg>