<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img"><title>change-decisions / release-publisher 1.2.0</title><rect x="1" y="1" width="1438" height="788" rx="22" fill="#f7f9ff" stroke="#d2dbef"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="18" font-weight="700" fill="#3f4c9e">RELEASE PUBLISHER / v1.2.0</text><text x="40" y="104" font-size="42" font-weight="700" fill="#172342">Choose the right visual update</text><text x="40" y="148" font-size="24" font-weight="400" fill="#172342">Put important changes in the docs. Retain accurate graphics.</text><rect x="40" y="186" width="1360" height="116" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="229" font-size="28" font-weight="700" fill="#172342">Small fix</text><text x="430" y="229" font-size="27" font-weight="700" fill="#3f4c9e">Check accuracy; reuse valid graphics</text><text x="430" y="269" font-size="24" font-weight="400" fill="#40506e">Update notes; no mandatory redraw.</text><rect x="40" y="320" width="1360" height="116" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="363" font-size="28" font-weight="700" fill="#172342">New capability</text><text x="430" y="363" font-size="27" font-weight="700" fill="#3f4c9e">Add feature docs and usage entry</text><text x="430" y="403" font-size="24" font-weight="400" fill="#40506e">Add visuals when explanation needs them.</text><rect x="40" y="454" width="1360" height="116" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="497" font-size="28" font-weight="700" fill="#172342">Core flow change</text><text x="430" y="497" font-size="27" font-weight="700" fill="#3f4c9e">Rewrite affected usage and relationships</text><text x="430" y="537" font-size="24" font-weight="400" fill="#40506e">Rebuild changed nodes and branches.</text><rect x="40" y="588" width="1360" height="116" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="631" font-size="28" font-weight="700" fill="#172342">New positioning</text><text x="430" y="631" font-size="27" font-weight="700" fill="#3f4c9e">Reassess the hero and capability story</text><text x="430" y="671" font-size="24" font-weight="400" fill="#40506e">Adjust page order to match actual changes.</text><text x="40" y="756" font-size="22" font-weight="400" fill="#40506e">Workflow rules · Impact matters more than the version number</text></g></svg>