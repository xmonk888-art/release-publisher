<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1060" viewBox="0 0 760 1060" role="img"><title>change-decisions / release-publisher 1.2.0</title><rect x="1" y="1" width="758" height="1058" rx="22" fill="#f7f9ff" stroke="#d2dbef"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="18" font-weight="700" fill="#3f4c9e">RELEASE PUBLISHER / v1.2.0</text><text x="40" y="104" font-size="38" font-weight="700" fill="#172342">变化决定更新方式</text><text x="40" y="148" font-size="24" font-weight="400" fill="#172342">重要变化进入正文与用法，准确的旧图可以复用。</text><rect x="40" y="186" width="680" height="174" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="228" font-size="30" font-weight="700" fill="#172342">小修复</text><text x="64" y="273" font-size="26" font-weight="700" fill="#3f4c9e">核对准确性，保留有效旧图</text><text x="64" y="316" font-size="24" font-weight="400" fill="#40506e">更新版本说明，不强制重画。</text><rect x="40" y="382" width="680" height="174" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="424" font-size="30" font-weight="700" fill="#172342">新增功能</text><text x="64" y="469" font-size="26" font-weight="700" fill="#3f4c9e">补充正文、入口与使用示例</text><text x="64" y="512" font-size="24" font-weight="400" fill="#40506e">需要直观解释时，再增加图文。</text><rect x="40" y="578" width="680" height="174" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="620" font-size="30" font-weight="700" fill="#172342">核心流程变化</text><text x="64" y="665" font-size="26" font-weight="700" fill="#3f4c9e">重写受影响用法与流程关系</text><text x="64" y="708" font-size="24" font-weight="400" fill="#40506e">节点、分支变了，重构对应图。</text><rect x="40" y="774" width="680" height="174" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="816" font-size="30" font-weight="700" fill="#172342">定位或主要能力变化</text><text x="64" y="861" font-size="26" font-weight="700" fill="#3f4c9e">重新评估首屏与核心能力展示</text><text x="64" y="904" font-size="24" font-weight="400" fill="#40506e">按实际变化调整页面顺序。</text><text x="40" y="1026" font-size="22" font-weight="400" fill="#40506e">示意规则 · 不按版本号大小机械判断重大更新</text></g></svg>