<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="710" viewBox="0 0 1440 710" role="img"><title>release-flow / release-publisher 1.2.0</title><rect x="1" y="1" width="1438" height="708" rx="22" fill="#f7f9ff" stroke="#d2dbef"/><g font-family="Segoe UI, Microsoft YaHei, sans-serif"><text x="40" y="48" font-size="18" font-weight="700" fill="#3f4c9e">RELEASE PUBLISHER / v1.2.0</text><text x="40" y="104" font-size="42" font-weight="700" fill="#172342">Changes become release materials</text><text x="40" y="148" font-size="24" font-weight="400" fill="#172342">Assess impact. Align docs, visuals, packages, and public links.</text><rect x="40" y="200" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="236" font-size="20" font-weight="700" fill="#3f4c9e">01</text><text x="64" y="275" font-size="28" font-weight="700" fill="#172342">Lock release inputs</text><text x="64" y="312" font-size="23" font-weight="400" fill="#40506e">Baseline, candidate, version, scope</text><rect x="500" y="200" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="524" y="236" font-size="20" font-weight="700" fill="#3f4c9e">02</text><text x="524" y="275" font-size="28" font-weight="700" fill="#172342">Assess feature changes</text><text x="524" y="312" font-size="23" font-weight="400" fill="#40506e">Judge user-visible impact</text><rect x="960" y="200" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="984" y="236" font-size="20" font-weight="700" fill="#3f4c9e">03</text><text x="984" y="275" font-size="28" font-weight="700" fill="#172342">Plan docs and visuals</text><text x="984" y="312" font-size="23" font-weight="400" fill="#40506e">Map usage, graphics, and evidence</text><rect x="40" y="390" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="64" y="426" font-size="20" font-weight="700" fill="#3f4c9e">04</text><text x="64" y="465" font-size="28" font-weight="700" fill="#172342">Verify the candidate</text><text x="64" y="502" font-size="23" font-weight="400" fill="#40506e">Check pages and extracted files</text><rect x="500" y="390" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="524" y="426" font-size="20" font-weight="700" fill="#3f4c9e">05</text><text x="524" y="465" font-size="28" font-weight="700" fill="#172342">Publish as authorized</text><text x="524" y="502" font-size="23" font-weight="400" fill="#40506e">Commit, tag, release, and assets</text><rect x="960" y="390" width="440" height="164" rx="16" fill="#fff" stroke="#d2dbef"/><text x="984" y="426" font-size="20" font-weight="700" fill="#3f4c9e">06</text><text x="984" y="465" font-size="28" font-weight="700" fill="#172342">Verify public results</text><text x="984" y="502" font-size="23" font-weight="400" fill="#40506e">Check pages and download hashes</text><rect x="40" y="606" width="1360" height="78" rx="16" fill="#eceffc" stroke="#d2dbef"/><text x="62" y="638" font-size="22" font-weight="400" fill="#40506e">Failed checks → fix and verify again</text><text x="62" y="674" font-size="22" font-weight="400" fill="#40506e">Candidate-only → local handoff; authorized → publish</text></g></svg>