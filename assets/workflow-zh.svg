<svg xmlns="http://www.w3.org/2000/svg" width="904" height="352" viewBox="0 0 904 352" role="img">
  <title>从项目到 GitHub</title>
  <defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.3" refY="2.5" orient="auto"><path d="M0 0l5 2.5L0 5z" fill="#9ba7ce"/></marker></defs>
  <rect x=".5" y=".5" width="903" height="351" rx="20" fill="#f7f9ff" stroke="#d2dbef"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="25" y="49" font-size="30" font-weight="700" fill="#172342">从项目到 GitHub</text>
    <rect x="24" y="74" width="264" height="104" rx="13" fill="#ffffff" stroke="#d2dbef"/><text x="40" y="103" font-size="18" font-weight="700" fill="#3f4c9e">01</text><text x="40" y="133" font-size="23" font-weight="700" fill="#172342">锁定发布范围</text><text x="40" y="160" font-size="18" font-weight="400" fill="#40506e">核对项目、版本和目标</text>
    <rect x="318" y="74" width="264" height="104" rx="13" fill="#ffffff" stroke="#d2dbef"/><text x="334" y="103" font-size="18" font-weight="700" fill="#3f4c9e">02</text><text x="334" y="133" font-size="23" font-weight="700" fill="#172342">准备图文和发行包</text><text x="334" y="160" font-size="18" font-weight="400" fill="#40506e">写说明、做配图、整附件</text>
    <rect x="612" y="74" width="264" height="104" rx="13" fill="#ffffff" stroke="#d2dbef"/><text x="628" y="103" font-size="18" font-weight="700" fill="#3f4c9e">03</text><text x="628" y="133" font-size="23" font-weight="700" fill="#172342">核验本地候选</text><text x="628" y="160" font-size="18" font-weight="400" fill="#40506e">检查页面、文件和校验值</text>
    <rect x="24" y="224" width="414" height="104" rx="13" fill="#ffffff" stroke="#d2dbef"/><text x="41" y="251" font-size="16" font-weight="700" fill="#3f4c9e">仅做候选</text><text x="41" y="282" font-size="23" font-weight="700" fill="#172342">交付本地审阅稿</text><text x="41" y="308" font-size="18" font-weight="400" fill="#40506e">保留预览、ZIP 和检查记录</text>
    <rect x="462" y="224" width="414" height="104" rx="13" fill="#eceffc" stroke="#d2dbef"/><text x="479" y="251" font-size="16" font-weight="700" fill="#3f4c9e">已授权发布</text><text x="479" y="282" font-size="23" font-weight="700" fill="#172342">提交并回验公开结果</text><text x="479" y="308" font-size="18" font-weight="400" fill="#40506e">核对公开页面和实际下载</text>
    <path d="M291 126h21" fill="none" stroke="#9ba7ce" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M585 126h21" fill="none" stroke="#9ba7ce" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M744 179v23H231" fill="none" stroke="#9ba7ce" stroke-width="2.5"/>
    <path d="M231 202v17" fill="none" stroke="#9ba7ce" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M669 202v17" fill="none" stroke="#9ba7ce" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>
