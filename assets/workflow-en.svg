<svg xmlns="http://www.w3.org/2000/svg" width="904" height="352" viewBox="0 0 904 352" role="img">
  <title>From project to GitHub</title>
  <defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="4.3" refY="2.5" orient="auto"><path d="M0 0l5 2.5L0 5z" fill="#9ba7ce"/></marker></defs>
  <rect x=".5" y=".5" width="903" height="351" rx="20" fill="#f7f9ff" stroke="#d2dbef"/>
  <g font-family="Segoe UI, Microsoft YaHei UI, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="25" y="49" font-size="30" font-weight="700" fill="#172342">From project to GitHub</text>
    <rect x="24" y="74" width="264" height="104" rx="13" fill="#ffffff" stroke="#d2dbef"/><text x="40" y="103" font-size="18" font-weight="700" fill="#3f4c9e">01</text><text x="40" y="133" font-size="23" font-weight="700" fill="#172342">Confirm scope</text><text x="40" y="160" font-size="18" font-weight="400" fill="#40506e">Project, version and target</text>
    <rect x="318" y="74" width="264" height="104" rx="13" fill="#ffffff" stroke="#d2dbef"/><text x="334" y="103" font-size="18" font-weight="700" fill="#3f4c9e">02</text><text x="334" y="133" font-size="23" font-weight="700" fill="#172342">Prepare materials</text><text x="334" y="160" font-size="18" font-weight="400" fill="#40506e">Docs, visuals and assets</text>
    <rect x="612" y="74" width="264" height="104" rx="13" fill="#ffffff" stroke="#d2dbef"/><text x="628" y="103" font-size="18" font-weight="700" fill="#3f4c9e">03</text><text x="628" y="133" font-size="23" font-weight="700" fill="#172342">Verify locally</text><text x="628" y="160" font-size="18" font-weight="400" fill="#40506e">Pages, files and checksums</text>
    <rect x="24" y="224" width="414" height="104" rx="13" fill="#ffffff" stroke="#d2dbef"/><text x="41" y="251" font-size="16" font-weight="700" fill="#3f4c9e">Candidate only</text><text x="41" y="282" font-size="23" font-weight="700" fill="#172342">Hand off the local draft</text><text x="41" y="308" font-size="18" font-weight="400" fill="#40506e">Preview, ZIP and check results</text>
    <rect x="462" y="224" width="414" height="104" rx="13" fill="#eceffc" stroke="#d2dbef"/><text x="479" y="251" font-size="16" font-weight="700" fill="#3f4c9e">Authorized to publish</text><text x="479" y="282" font-size="23" font-weight="700" fill="#172342">Publish and verify</text><text x="479" y="308" font-size="18" font-weight="400" fill="#40506e">Check public pages and downloads</text>
    <path d="M291 126h21" fill="none" stroke="#9ba7ce" stroke-width="2.5" marker-end="url(#arrow)"/>
